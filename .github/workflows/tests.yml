name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install backend + test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install runtime deps first; the production requirements.txt
          # already declares compatible ranges.
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest -v

  ruff:
    name: ruff (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint changed Python
        # Advisory only — this repo had no linter before, so we don't
        # fail the build on existing import/style drift. The job lists
        # the lint output so reviewers see what would change.
        run: |
          ruff check backend/ tests/ || true
          echo "note: this job is advisory only"
